<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raptor Drift</title>
<style>
  html,body,canvas{margin:0;width:100%;height:100%;display:block;overflow:hidden;background:#130b22;color:#fff;font:700 18px system-ui}
  .hud{position:fixed;top:18px;left:20px;z-index:2}.tip{position:fixed;bottom:18px;width:100%;text-align:center;color:#dac6ff;font-size:14px;z-index:2}
  .screen{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#130b22bb;text-align:center;font-size:34px;cursor:pointer;border:0;color:#fff;font:700 34px system-ui}
  .screen small{display:block;margin-top:10px;font-size:15px;color:#dac6ff}
</style>
<canvas></canvas>
<div class="hud">RAPTOR DRIFT<br><span id="score">0 m</span></div>
<div class="tip">Hold Space / touch to steer right · release to steer left</div>
<button class="screen" id="start" type="button" aria-label="Start Raptor Drift">RAPTOR DRIFT<small>Tap or press Space to begin</small></button>
<script>
  const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d'), start=document.querySelector('#start'), score=document.querySelector('#score');
  let W=0,H=0,car,road=[],meters=0,speed=2.3,running=false,holding=false;
  function begin(){
    W=canvas.width=innerWidth; H=canvas.height=innerHeight; car={x:W/2,y:H*.78}; road=[];
    let center=W/2; for(let y=H+80;y>-1600;y-=34){center+=Math.sin(y*.007)*18;road.push({x:center,y})}
    meters=0; speed=2.3; running=true; start.style.display='none';
  }
  function press(event){if(event.code==='Space'){holding=true; if(!running)begin(); event.preventDefault()}}
  addEventListener('keydown',press); addEventListener('keyup',event=>{if(event.code==='Space')holding=false});
  start.addEventListener('click',()=>{holding=false;begin()});
  addEventListener('pointerdown',event=>{if(event.target===start)return; holding=true; if(!running)begin()});
  addEventListener('pointerup',()=>holding=false); addEventListener('pointercancel',()=>holding=false);
  addEventListener('resize',()=>{if(running)begin()});
  function extendRoad(){const last=road[road.length-1];road.push({x:Math.max(W*.25,Math.min(W*.75,last.x+(Math.random()-.5)*W*.13)),y:last.y-34})}
  function draw(){
    if(running){
      speed=Math.min(5,meters/900+2.3); car.x+=(holding?1:-1)*speed*1.25; road.forEach(piece=>piece.y+=speed);
      while(road.length&&road[0].y>H+55)road.shift(); while(road[road.length-1].y>-50)extendRoad();
      const near=road.reduce((best,piece)=>Math.abs(piece.y-car.y)<Math.abs(best.y-car.y)?piece:best);
      if(Math.abs(car.x-near.x)>W*.28){running=false;start.innerHTML='OFF THE ROAD<small>'+Math.floor(meters)+' m — tap to retry</small>';start.style.display='grid'}
      meters+=speed*.25;
    }
    ctx.fillStyle='#130b22';ctx.fillRect(0,0,W||innerWidth,H||innerHeight);
    for(let i=0;i<road.length-1;i++){const a=road[i],b=road[i+1];ctx.strokeStyle='#543080';ctx.lineWidth=W*.56;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#eee4ff';ctx.lineWidth=5;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}
    if(car){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(holding?.15:-.15);ctx.fillStyle='#a96cff';ctx.fillRect(-W*.045,-H*.05,W*.09,H*.11);ctx.fillStyle='#171020';ctx.fillRect(-W*.032,-H*.035,W*.064,H*.038);ctx.restore()}
    score.textContent=Math.floor(meters)+' m';requestAnimationFrame(draw);
  }
  draw();
</script>
</html>
