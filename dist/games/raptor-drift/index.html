<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raptor Drift</title><style>html,body,canvas{margin:0;width:100%;height:100%;display:block;overflow:hidden;background:#130b22;color:white;font:700 18px system-ui}.hud{position:fixed;top:18px;left:20px}.tip{position:fixed;bottom:18px;width:100%;text-align:center;color:#dac6ff;font-size:14px}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#130b22bb;text-align:center;font-size:34px}.screen small{font-size:15px;color:#dac6ff}</style><canvas></canvas><div class="hud">RAPTOR DRIFT<br><span id="s">0 m</span></div><div class="tip">Hold Space / touch to steer right • release to steer left</div><div class="screen" id="go">RAPTOR DRIFT<small>Tap or press Space to begin</small></div><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),go=document.querySelector('#go'),sc=document.querySelector('#s');let W,H,car,road,m=0,v=2.3,on=0,hold=0;function reset(){W=c.width=innerWidth;H=c.height=innerHeight;car={x:W/2,y:H*.78};road=[];let q=W/2;for(let y=H+80;y>-1600;y-=34){q+=Math.sin(y*.007)*18;road.push({x:q,y})}m=0;v=2.3;on=1;go.style.display='none'}addEventListener('resize',()=>on&&reset());addEventListener('keydown',e=>{if(e.code==='Space'){hold=1;reset();e.preventDefault()}});addEventListener('keyup',e=>e.code==='Space&&(hold=0));addEventListener('pointerdown',()=>{hold=1;reset()});addEventListener('pointerup',()=>hold=0);function add(){let z=road.at(-1);road.push({x:Math.max(W*.25,Math.min(W*.75,z.x+(Math.random()-.5)*W*.13)),y:z.y-34})}function frame(){if(on){v=Math.min(5,m/900+2.3);car.x+=(hold?1:-1)*v*1.25;for(let r of road)r.y+=v;while(road[0].y>H+55)road.shift();while(road.at(-1).y>-50)add();let n=road.reduce((a,b)=>Math.abs(a.y-car.y)<Math.abs(b.y-car.y)?a:b);if(Math.abs(car.x-n.x)>W*.28){on=0;go.innerHTML='OFF THE ROAD<small>'+Math.floor(m)+' m — tap to retry</small>';go.style.display='grid'}m+=v*.25}x.fillStyle='#130b22';x.fillRect(0,0,W,H);for(let i=0;i<road.length-1;i++){let a=road[i],b=road[i+1];x.strokeStyle='#543080';x.lineWidth=W*.56;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.strokeStyle='#eee4ff';x.lineWidth=5;x.setLineDash([18,18]);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.setLineDash([])}x.save();x.translate(car.x,car.y);x.rotate(hold?.15:-.15);x.fillStyle='#a96cff';x.fillRect(-W*.045,-H*.05,W*.09,H*.11);x.fillStyle='#171020';x.fillRect(-W*.032,-H*.035,W*.064,H*.038);x.restore();sc.textContent=Math.floor(m)+' m';requestAnimationFrame(frame)}frame();</script>
