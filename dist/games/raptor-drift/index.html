<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raptor Drift</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#12091e;color:#fff;font-family:system-ui}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:16px;left:18px;font-weight:900;font-size:18px;letter-spacing:.04em;text-shadow:0 2px 5px #000}.hud span{color:#d8c3ff}.tip{position:fixed;bottom:17px;width:100%;text-align:center;color:#dac8ff;font-size:14px}.start{position:fixed;inset:0;display:grid;place-items:center;background:#12091ecc;text-align:center;font-size:34px;font-weight:900}.start small{display:block;font-size:15px;color:#dac8ff;margin-top:12px}</style></head><body><canvas id="c"></canvas><div class="hud">RAPTOR DRIFT<br><span id="score">0 m</span></div><div class="tip">Hold Space / click / touch to steer right. Release to steer left.</div><div class="start" id="start">RAPTOR DRIFT<small>Press Space or tap to start</small></div><script>const c=document.querySelector('#c'),g=c.getContext('2d'),s=document.querySelector('#score'),start=document.querySelector('#start');let W,H,car,road,coins,meters,speed,live=false,hold=false;function reset(){W=c.width=innerWidth;H=c.height=innerHeight;car={x:W/2,y:H*.76};meters=0;speed=5;coins=[];road=[];let cx=W/2;for(let y=H+80;y>-1200;y-=42){cx+=Math.sin(y*.008)*13;road.push({x:cx,y})}}addEventListener('resize',reset);function begin(){if(!live){reset();live=true;start.style.display='none'}}addEventListener('keydown',e=>{if(e.code==='Space'){hold=true;begin();e.preventDefault()}});addEventListener('keyup',e=>e.code==='Space'&&(hold=false));addEventListener('pointerdown',()=>{hold=true;begin()});addEventListener('pointerup',()=>hold=false);function addRoad(){let last=road[road.length-1];let bend=(Math.random()-.5)*150;road.push({x:Math.max(W*.18,Math.min(W*.82,last.x+bend)),y:last.y-42});if(Math.random()<.18)coins.push({x:last.x+(Math.random()-.5)*80,y:last.y-42})}function draw(){g.fillStyle='#12091e';g.fillRect(0,0,W,H);for(let i=0;i<road.length-1;i++){let a=road[i],b=road[i+1];g.strokeStyle='#4d2b79';g.lineWidth=185;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.strokeStyle='#f5efff';g.lineWidth=4;g.setLineDash([14,14]);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.setLineDash([])}for(const q of coins){g.fillStyle='#ffd550';g.beginPath();g.arc(q.x,q.y,9,0,7);g.fill()}g.save();g.translate(car.x,car.y);g.rotate((hold?.28:-.28));g.fillStyle='#a968ff';g.fillRect(-18,-30,36,60);g.fillStyle='#21112f';g.fillRect(-13,-18,26,24);g.fillStyle='#fff';g.fillRect(-11,-26,8,5);g.fillRect(3,-26,8,5);g.restore()}function loop(){if(live){speed=Math.min(11,5+meters/750);car.x+=(hold?1:-1)*speed*1.15;meters+=speed*.17;for(const r of road)r.y+=speed;while(road[0].y>H+70)road.shift();while(road[road.length-1].y>-80)addRoad();for(const q of coins)q.y+=speed;coins=coins.filter(q=>q.y<H+30);for(let i=coins.length-1;i>=0;i--)if(Math.hypot(coins[i].x-car.x,coins[i].y-car.y)<32){meters+=25;coins.splice(i,1)}let near=road.reduce((best,r)=>Math.abs(r.y-car.y)<Math.abs(best.y-car.y)?r:best);if(Math.abs(car.x-near.x)>104){live=false;start.innerHTML='OFF THE ROAD<small>Score: '+Math.floor(meters)+' m — tap or press Space to try again</small>';start.style.display='grid'}}draw();s.textContent=Math.floor(meters)+' m';requestAnimationFrame(loop)}reset();draw();loop();</script></body></html>
