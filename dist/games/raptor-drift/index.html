<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raptor Drift</title>
<style>
  html,body,canvas{margin:0;width:100%;height:100%;display:block;overflow:hidden;background:#130b22;color:#fff;font:700 18px system-ui}
  .hud{position:fixed;top:18px;left:20px;z-index:2;letter-spacing:.08em;text-shadow:0 2px 8px #000}.hud span{font-size:14px;color:#decaff}
  .tip{position:fixed;bottom:16px;width:100%;text-align:center;color:#eadfff;font-size:13px;z-index:2;text-shadow:0 2px 8px #000}
  .screen{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#130b22b8;text-align:center;font-size:34px;cursor:pointer;border:0;color:#fff;font:700 34px system-ui}
  .screen small{display:block;margin-top:11px;font-size:15px;color:#decaff}.screen:focus-visible{outline:4px solid #fff;outline-offset:-10px}
</style>
<canvas></canvas>
<div class="hud">RAPTOR DRIFT<br><span id="score">0 m</span></div>
<div class="tip">Hold <b>Space</b> to drift right · release to drive straight</div>
<button class="screen" id="start" type="button">RAPTOR DRIFT<small>Click, tap, or press Space to begin</small></button>
<script>
  const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),start=document.querySelector('#start'),score=document.querySelector('#score');
  let W=0,H=0,running=false,space=false,distance=0,carX=0;
  const block=860,roadWidth=520,turns=[0,0,230,0,280,0,250,0,310,0,220,0,290,0,260,0,330,0,240,0];
  function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}resize();addEventListener('resize',resize);
  function roadCenter(z){let n=Math.max(0,Math.floor(z/block)),x=0;for(let i=0;i<=n;i++)x+=turns[i%turns.length];return x}
  function begin(){running=true;space=false;distance=0;carX=0;start.style.display='none'}
  function crash(){running=false;space=false;start.innerHTML='OFF THE ROAD<small>'+Math.floor(distance/10)+' m — click or tap to retry</small>';start.style.display='grid'}
  start.addEventListener('click',begin);
  addEventListener('keydown',event=>{if(event.code==='Space'){space=true;if(!running)begin();event.preventDefault()}});
  addEventListener('keyup',event=>{if(event.code==='Space')space=false});
  canvas.addEventListener('pointerdown',()=>{space=true;if(!running)begin()});addEventListener('pointerup',()=>space=false);addEventListener('pointercancel',()=>space=false);
  function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
  function roadTile(center,z,depth,scale){const y=H*.78-(z-distance)*scale,x=W/2+(center-carX)*scale,wide=roadWidth*scale;box(x-wide/2,y-depth*scale,wide,depth*scale,'#40235a');box(x-wide/2-9,y-depth*scale,9,depth*scale,'#ba7aff');box(x+wide/2,y-depth*scale,9,depth*scale,'#ba7aff');ctx.strokeStyle='#663f83';ctx.lineWidth=2;ctx.strokeRect(x-wide/2,y-depth*scale,wide,depth*scale)}
  function drawCar(){const x=W/2,y=H*.73,s=Math.min(W,H)/720;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#130b22';ctx.fillRect(-79,40,31,73);ctx.fillRect(48,40,31,73);ctx.fillStyle='#712bc2';ctx.beginPath();ctx.moveTo(-72,95);ctx.lineTo(-61,-48);ctx.lineTo(-35,-83);ctx.lineTo(35,-83);ctx.lineTo(61,-48);ctx.lineTo(72,95);ctx.lineTo(48,118);ctx.lineTo(-48,118);ctx.closePath();ctx.fill();ctx.fillStyle='#b982ff';ctx.beginPath();ctx.moveTo(-43,-45);ctx.lineTo(-22,-70);ctx.lineTo(22,-70);ctx.lineTo(43,-45);ctx.closePath();ctx.fill();ctx.fillStyle='#1d1230';ctx.beginPath();ctx.moveTo(-33,-44);ctx.lineTo(-17,-62);ctx.lineTo(17,-62);ctx.lineTo(33,-44);ctx.closePath();ctx.fill();ctx.fillStyle='#f4eaff';ctx.fillRect(-53,72,25,9);ctx.fillRect(28,72,25,9);ctx.fillStyle='#9f56ff';ctx.fillRect(-62,15,124,13);ctx.restore()}
  function render(){
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#241239');bg.addColorStop(1,'#10081e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const scale=Math.min(.42,H/1500),first=Math.max(0,Math.floor(distance/block)-1),last=Math.floor((distance+H/scale+block)/block)+1;
    for(let n=last;n>=first;n--){const z=n*block,center=roadCenter(z);roadTile(center,z,block,scale);if(n>0&&turns[(n)%turns.length]){const previous=roadCenter(z-block),y=H*.78-(z-distance)*scale;const min=Math.min(previous,center),width=Math.abs(center-previous)+roadWidth;box(W/2+(min-carX)*scale-roadWidth*scale/2,y-10,width*scale,20,'#40235a');box(W/2+(min-carX)*scale-roadWidth*scale/2,y-12,width*scale,4,'#ba7aff');box(W/2+(min-carX)*scale-roadWidth*scale/2,y+8,width*scale,4,'#ba7aff')}}
    drawCar();
  }
  function loop(){if(running){const speed=Math.min(12,7+distance/18000);if(space)carX+=4.1*(speed/7);distance+=speed;const center=roadCenter(distance);if(Math.abs(carX-center)>roadWidth*.42)crash();score.textContent=Math.floor(distance/10)+' m'}render();requestAnimationFrame(loop)}loop();
</script>
</html>
